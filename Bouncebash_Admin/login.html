<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff sign in · Bounce Bash PH Admin</title>
<link rel="stylesheet" href="styles.css">
<style>
  body.login-page { min-height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #ecdfcd 0%, #faf6f0 55%); }
  .login-wrap { width: 100%; max-width: 400px; }
  .login-brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
  .login-brand img { width: 220px; max-width: 70%; height: auto; }
  .login-brand .kicker { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
  .login-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 30px 28px 26px; box-shadow: 0 18px 40px rgba(62,50,43,.08); }
  .login-card h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; margin: 0 0 4px; color: var(--ink); }
  .login-card .lead { margin: 0 0 22px; color: var(--mute); font-size: 14px; }
  .login-card .field { margin-bottom: 14px; }
  .login-card label { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fdfbf7; color: var(--ink); font-size: 15px; font-family: inherit; }
  .login-card input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  .login-submit { width: 100%; margin-top: 8px; padding: 13px 16px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font-size: 15px; font-family: inherit; cursor: pointer; transition: background .2s; }
  .login-submit:hover { background: var(--gdark); }
  .login-submit:disabled { opacity: .6; cursor: default; }
  .login-submit:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #login-message { min-height: 1.2em; margin: 12px 0 0; font-size: 14px; text-align: center; }
  #login-message.bad { color: var(--red); }
  .login-foot { text-align: center; margin-top: 18px; font-size: 12px; color: var(--mute); }
</style>
</head>
<body class="login-page">
<div class="login-wrap">
  <div class="login-brand">
    <img src="assets/logo-full.png" alt="Bounce Bash PH">
    <span class="kicker">Admin panel</span>
  </div>
  <form id="login-form" class="login-card">
    <h1>Staff sign in</h1>
    <p class="lead">Use the account your team gave you.</p>
    <div class="field">
      <label for="staff-email">Email</label>
      <input type="email" id="staff-email" name="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="staff-password">Password</label>
      <input type="password" id="staff-password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-submit" id="login-submit">Sign in</button>
    <p id="login-message" role="alert"></p>
  </form>
  <p class="login-foot">Bounce Bash PH · Staff only</p>
</div>
<script src="admin-login.js"></script>
</body>
</html>
