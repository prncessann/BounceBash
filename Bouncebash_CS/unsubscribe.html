<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe - Bounce Bash PH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a href="index.html" class="brand"><img src="assets/logo/logo-full.png" alt="Bounce Bash PH" class="logo"></a>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="calendar.html">Calendar</a>
  </nav>
  <a href="account.html" class="btn btn-outline">My Account</a>
</header>
<section class="page-header">
  <p class="eyebrow">Email preferences</p>
  <h1>Unsubscribe</h1>
  <p class="lead">Confirm whether you want to stop receiving Bounce Bash updates.</p>
</section>
<section class="account-layout">
  <form id="newsletter-unsubscribe-confirm-form" class="card">
    <button type="submit" class="btn btn-dark">Confirm unsubscribe</button>
    <p id="unsubscribe-message" class="muted small" role="status" aria-live="polite"></p>
  </form>
</section>
<script src="app.js" defer></script>
</body>
</html>
