<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – Bounce Bash PH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a href="index.html" class="brand"><img src="assets/logo/logo-full.png" alt="Bounce Bash PH" class="logo"></a>
  <div class="header-actions">
    <a href="signup.html" class="btn btn-outline">Sign up</a>
  </div>
</header>

<section class="auth-section">
  <div class="card auth-card">
    <p class="eyebrow center">Welcome back</p>
    <h1 class="center">Log in</h1>
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-book btn-block">Log in</button>
      <p><a href="account-help.html">Forgot password?</a></p>
      <p id="login-message" class="small mt-12" role="status"></p>
    </form>
    <p class="switch">Wala ka pang account? <a href="signup.html">Sign up</a></p>
  </div>
</section>
<script src="site.js"></script><script src="js/catalog-tools.js"></script>
</body>
</html>
